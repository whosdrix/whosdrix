<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24">
  <defs>
    <linearGradient id="p" x1="0" x2="1">
      <stop offset="0" stop-color="#ff0055" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff0055"/>
      <stop offset="1" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pulse { animation: go 3.2s cubic-bezier(.6,0,.4,1) infinite; }
    .node  { animation: beat 3.2s ease-in-out infinite; transform-origin: 450px 12px; }
    @keyframes go   { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
    @keyframes beat { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.6); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#8b8b95" stroke-opacity=".25"/>
  <rect class="pulse" x="0" y="11" width="200" height="2" fill="url(#p)"/>
  <circle class="node" cx="450" cy="12" r="3" fill="#ff0055"/>
</svg>
