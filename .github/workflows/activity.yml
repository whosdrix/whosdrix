name: activity graph

on:
  schedule:
    - cron: "17 3 * * *"   # once a day, ~5am Czech time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/_activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: draw assets/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 assets/_activity.py ${{ github.repository_owner }}
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if ! git diff --cached --quiet; then git commit -m "activity graph: sync" && git push; fi
